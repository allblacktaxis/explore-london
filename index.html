<title>Explore London – a cabbie's guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F1E3D;--navy2:#1B2E57;--orange:#F28C38;--cream:#FFF4E8;--bg:#DCE2EB;--ink:#0F1E3D;--muted:#55617A;--line:#C9D1DE;--plaque:#2E6FD8;--green:#3E9B6B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#C9D1DD}
body{font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:'Archivo',sans-serif}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:500}
.row{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.iconbtn.light{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,30,61,.15)}
.search{display:flex;align-items:center;gap:10px;height:46px;min-height:46px;box-sizing:border-box;border-radius:23px;background:#fff;color:var(--muted);padding:0 16px;flex:1;min-width:0}
.search input{border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);flex:1;min-width:0;background:transparent}
.content{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(#fff,#F1F4F8);border:1px solid #D2D9E3;border-radius:14px;padding:8px 4px 10px;min-height:88px;text-decoration:none;text-align:center;box-shadow:inset 0 -4px 0 var(--c,#C9D1DE),0 6px 12px rgba(15,30,61,.16),0 1px 3px rgba(15,30,61,.12);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--c,#C9D1DE),0 2px 4px rgba(15,30,61,.14)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.tile .ic{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.tile span.l{font-size:12.5px;font-weight:600;line-height:1.15}
.bigbtn{display:flex;justify-content:center;align-items:center;gap:10px;height:50px;border-radius:25px;background:var(--navy);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;text-decoration:none;border:0;width:100%}
.bigbtn.orange{background:var(--orange);color:var(--navy);font-weight:800}
.ghost{display:flex;justify-content:center;align-items:center;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:15px;font-weight:600;text-decoration:none;color:var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec h2{margin:0;font-size:18px;font-weight:800}
.sec a{font-size:14px;font-weight:600}
.ncard{flex:0 0 150px;display:flex;flex-direction:column;gap:5px;background:#fff;border-radius:16px;padding:10px;text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(15,30,61,.1)}.ncard b{font-size:14.5px;line-height:1.2}.ncard span:last-child{font-size:13px;line-height:1.3;color:var(--muted)}.ncard.more{flex-basis:110px;align-items:center;justify-content:center;text-align:center;background:var(--navy);color:#fff}
.opin{position:relative;box-sizing:border-box;border-radius:50%;background:#fff;border:3px solid var(--c);box-shadow:0 2px 5px rgba(15,30,61,.35);display:flex;align-items:center;justify-content:center}.opin img{width:62%;height:62%;object-fit:contain}.opin:after{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:6px solid transparent;border-top:8px solid var(--c);border-bottom:0}
.cabb{position:absolute;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;background:#F5B83D;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center}
.tpin{position:relative;filter:drop-shadow(0 2px 2px rgba(15,30,61,.35))}.tpin svg{display:block}.tpin img{position:absolute;object-fit:contain}.tpin img.wpic{filter:brightness(0) invert(1)}.pinsel .tpin img.wpic{filter:brightness(0) invert(1) drop-shadow(0 0 .6px #fff) drop-shadow(0 0 .6px #fff)}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.wcard{width:168px;flex-shrink:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(15,30,61,.08);text-decoration:none}
.wcard .b{height:86px;padding:8px}
.badge{font-size:11.5px;font-weight:700;border-radius:9px;padding:2px 8px;display:inline-block}
.wcard .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.row-card{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px;text-decoration:none;box-shadow:0 1px 2px rgba(15,30,61,.08)}
.thumb{width:52px;height:52px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
.thumb.plaque,.plaquedot{border-radius:50%;background:var(--plaque);box-shadow:inset 0 0 0 3px #fff,0 0 0 1px var(--plaque)}
.rc-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.rc-n{font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-l{font-size:13px;color:#2B3A55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.free{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:var(--green);color:#fff;border-radius:6px;padding:0 5px}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pill{height:36px;border-radius:18px;border:0;background:#fff;color:var(--ink);font-size:13px;font-weight:700;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.on{background:var(--orange)}
.cpills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cpill{display:flex;align-items:center;gap:6px;border-radius:18px;padding:4px 8px 4px 4px;background:#fff;color:var(--ink);border:0;min-height:36px;text-align:left}
.cpill .ci{width:28px;height:28px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cpill .ci img{width:18px;height:18px}
.cpill>span:last-child{font-size:13px;font-weight:700;line-height:1.1}
.cpill.on{background:var(--orange);box-shadow:inset 0 0 0 2px #fff}
.hpills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hpill{height:34px;border-radius:17px;border:0;background:var(--navy2);color:#fff;font-size:14px;font-weight:600;padding:0 12px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.hpill.on{background:var(--orange);color:var(--navy);font-weight:700}
.dot{width:10px;height:10px;border-radius:5px;display:inline-block}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{flex:1 1 0;min-width:0}.filters.four select{flex:1 1 calc(50% - 4px)}
.filters select{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--ink);padding:0 10px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--navy);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 2px calc(10px + env(safe-area-inset-bottom));z-index:1000}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;justify-content:center;text-decoration:none;font-size:14px;font-weight:700;color:#A9B6CE;white-space:nowrap}
nav.tabs a i{width:26px;height:4px;border-radius:2px;background:transparent;margin-top:1px}
nav.tabs a.on{color:#fff}nav.tabs a.on i{background:var(--orange)}
.hero{position:relative;height:200px;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.hero .acts{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between}
.sheet{background:#fff;border-radius:22px 22px 0 0;margin-top:-18px;padding:16px;position:relative;display:flex;flex-direction:column;gap:10px}
.kicker{font-size:12.5px;font-weight:700;color:#A8551A;text-transform:uppercase;letter-spacing:.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.thumb.sm{border-radius:9px}.thumb.sm.plaque{border-radius:50%}
.tag{font-size:13px;font-weight:700;background:#F5D9A8;border-radius:12px;padding:3px 10px}
.story{background:var(--cream);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.story b.k{color:#A8551A}
.credit{font-size:11.5px;color:var(--muted);padding:4px 16px 0}
.map{height:calc(100dvh - 200px);min-height:380px;position:relative}
#leaf{position:absolute;inset:0}
.overlay{position:absolute;left:12px;right:12px;z-index:600}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(15,30,61,.16);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mins button{height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.mins button b{font-size:14px}.mins button small{font-size:11.5px;color:var(--muted)}
.mins button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.mins button.on small{color:#F5C79A}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:600;padding:0 12px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tick{width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:#fff;color:var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.empty{background:#fff;border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.welcome{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:0 0 32px}
.wel{min-height:100vh;min-height:100dvh;background:#fff;color:#0F0D0B;display:flex;flex-direction:column;font-family:'Poppins',system-ui,sans-serif}
.wel-top{display:flex;flex-direction:column;align-items:center;gap:6px;padding:calc(40px + env(safe-area-inset-top)) 20px 0;text-align:center}
.wel-badge{width:46%;max-width:200px;height:auto;display:block}
.wel h1{margin:8px 0 0;font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(28px,10.3vw,46px);line-height:1;letter-spacing:-1px;white-space:nowrap}
.wel-top p{margin:0;font-weight:500;font-size:clamp(11px,3.45vw,15px);letter-spacing:.3px}
.wel-sky{width:100%;aspect-ratio:390/315;object-fit:cover;object-position:center bottom;display:block;margin-top:2px}
.wel-band{flex:1;background:#0F0D0B;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 24px calc(28px + env(safe-area-inset-bottom));text-align:center}
.wel-cab{width:67%;height:auto;display:block;margin-top:-30.3%}
.wel-band h2{margin:2px 0 0;font-family:'Poppins',sans-serif;font-weight:600;font-size:20px;line-height:1.2}
.wel-band p{margin:0;font-size:14px;line-height:1.45;color:#D9D4CC;max-width:330px}
.wel-go{display:flex;align-items:center;justify-content:center;align-self:stretch;height:56px;border-radius:28px;background:#F9B10F;color:#0F0D0B;font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;text-decoration:none}
.wel-free{font-size:13px;color:#BDB6AB}
@media (max-height:700px){.wel-top{padding-top:calc(20px + env(safe-area-inset-top));gap:4px}.wel-badge{width:38%}.wel h1{font-size:clamp(26px,9vw,40px)}.wel-band{gap:8px}}
.cabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 -8px}
.cabs img{width:100%;aspect-ratio:1/1;border-radius:14px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.av{width:56px;height:56px;border-radius:28px;border:2px solid var(--orange);object-fit:cover;background:var(--navy2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:800;font-size:18px}
.pin{width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.pl{background:var(--plaque)!important;box-shadow:inset 0 0 0 4px var(--plaque),inset 0 0 0 7px #fff,0 1px 3px rgba(0,0,0,.35)}
.num{width:26px;height:26px;border-radius:13px;background:var(--navy);color:#fff;border:2px solid #fff;font:800 13px 'Archivo';display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.me{width:18px;height:18px;border-radius:50%;background:var(--plaque);border:3px solid #fff;box-shadow:0 0 0 8px rgba(46,111,216,.2)}
.stop{display:flex;gap:10px;background:#fff;border-radius:12px;padding:10px;box-shadow:0 1px 2px rgba(15,30,61,.08)}
.note{font-size:13px;color:var(--muted);line-height:1.4}

let PLANS = null;

async function plansScreen() {
  setTitle('Free day plans'); await loadPlans();

    <div class="content">${PLANS.map(pl => `<a class="row-card" href="#/plan/${pl.n}"><span class="thumb" style="background:#FFF4E8;overflow:hidden"><img src="img/cab-small.webp" alt="" style="width:46px;height:auto;display:block"></span><span class="rc-t"><span class="rc-n">${esc(pl.title)}</span><span class="rc-m">${esc(pl.meta)}</span><span class="rc-l">${esc(pl.sub)}</span></span></a>`).join('')}</div>${tabs('Explore')}`;
}
async function planScreen(n) {
  await loadPlans(); const pl = PLANS.find(x => String(x.n) === String(n)); if (!pl) return plansScreen();
  setTitle(pl.title);
  const chip = id => { const q = byId[id]; return q ? `<a href="#/place/${q.id}" style="display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #E1E6EE;border-radius:10px;padding:3px 8px 3px 3px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600">${catTile(q, q.cats[0], 24).replace('class="thumb', 'class="thumb sm')}${esc(q.name)}</a>` : ''; };
  app.innerHTML = `<div class="top"><div class="row">${backBtn('#/plans')}<div style="display:flex;flex-direction:column"><h1 style="margin:0;font-weight:800;font-size:21px;line-height:1.15">${esc(pl.title)}</h1><span style="font-size:14px;color:#C9D3E6">${esc(pl.sub)}</span></div></div></div>

function shortAddr(p) { let a = (p.address || '').split(',')[0].trim(); a = a.replace(/\s+(London\b|[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}).*$/i, ''); const ar = (p.area || '').split(/ & /); ar.forEach(x => { a = a.replace(new RegExp('\\s+' + x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i'), ''); }); return a || p.area; }

function restTile(p, size) {

/* Free-licence photos from Wikipedia/Wikimedia Commons, only when the article is right next to the place */
/* photos Matt has checked and rejected (place ids): never show one for these */
const PHOTO_BLOCK = new Set([298]);
/* businesses rarely have their own Wikipedia article, so a "near and sounds similar" match is usually a different building */
const BIZ = ['Restaurants', 'Pubs', 'Bars & Nightlife', 'Food Shops', 'Shopping', 'Games & Activities', 'Spas & Wellness', 'Markets & Food Halls', 'Theatre & Shows', 'Sport'];
async function loadPhoto(p) {
  if (p.lat == null || p.cats.includes('Blue Plaques') || PHOTO_BLOCK.has(p.id) || store.get('el_badphoto', []).includes(p.id)) return;
  const cache = store.get('el_photo2', {});
  let ph = cache[p.id];
  if (ph === undefined) {
    ph = null;
    try {
      const u = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${p.lat}|${p.lng}&ggsradius=250&ggslimit=15&prop=pageimages&piprop=thumbnail|name&pithumbsize=900&pilicense=free`;
      const r = await fetch(u).then(r => r.json());
      const pages = Object.values((r.query || {}).pages || {}).filter(x => x.thumbnail && x.pageimage);
      const words = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !['the','and','london','ye','olde','pub','bar','restaurant','museum'].includes(w));
      const pw = words(p.name);
      const norm = t => t.toLowerCase().replace(/\s*\([^)]*\)\s*/g, ' ').replace(/^the /, '').replace(/[^a-z0-9]+/g, ' ').trim();
      const biz = p.cats.every(c => BIZ.includes(c));
      let best = null, score = 0;
      pages.forEach(x => {
        const tw = words(x.title), hit = pw.filter(w => tw.includes(w)).length;
        /* the article must be about this place: every word of the name, and not much else in the title */
        let s = pw.length && hit === pw.length && tw.length <= pw.length + 1 ? 1 : 0;
        /* for restaurants, pubs, bars and shops the article title must be the place's own name, e.g. "Rules (restaurant)" */
        if (biz && norm(x.title) !== norm(p.name)) s = 0;
        if (s > score) { score = s; best = x; }
      });
      if (best && score >= 1) {
        const m = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&titles=File:${encodeURIComponent(best.pageimage)}&prop=imageinfo&iiprop=extmetadata|url`).then(r => r.json());
        const ii = Object.values(m.query.pages)[0].imageinfo?.[0]; const md = ii?.extmetadata || {};
        const strip = h => (h || '').replace(/<[^>]+>/g, '').trim();
        ph = {src: best.thumbnail.source, by: strip(md.Artist?.value).slice(0, 60) || 'Unknown', lic: strip(md.LicenseShortName?.value) || 'free licence', page: ii?.descriptionurl || ''};
      }
    } catch (e) { ph = undefined; }
    if (ph !== undefined) { cache[p.id] = ph; store.set('el_photo2', cache); }
  }
  if (ph && location.hash === '#/place/' + p.id) {
    const h = document.getElementById('hero');
    h.style.backgroundImage = `url("${ph.src}")`; h.querySelector('.heroic')?.remove();
    document.getElementById('credit').innerHTML = `Photo: ${esc(ph.by)}, ${esc(ph.lic)}, via <a href="${esc(ph.page)}" target="_blank" rel="noopener">Wikimedia Commons</a> · <a href="#" id="badph" style="color:#C8262B;font-weight:700">Wrong photo?</a>`;
    document.getElementById('badph').onclick = e => { e.preventDefault(); const b = store.get('el_badphoto', []); if (!b.includes(p.id)) b.push(p.id); store.set('el_badphoto', b); h.style.backgroundImage = ''; document.getElementById('credit').textContent = 'Photo removed. Thanks, it’s on your list in About.'; };
  }
}

      ${w.routes ? '' : w.stops.length ? `<div class="row" style="gap:8px"><a class="bigbtn" style="flex:1;height:46px" target="_blank" rel="noopener" href="${gm}">${svg('walk', 18, '#F28C38', 2.2)} Open in Google Maps</a>${id === 'mine' ? '<a class="ghost" href="#/mywalk" onclick="setTimeout(()=>route(),0)">Rebuild</a>' : ''}</div>` : `<div class="empty">No matching places close enough. Try more interests or more time.</div>`}
      ${w.stops.map((s, i) => `<div class="stop"><span class="num" style="flex-shrink:0${s.route ? ';' + numSty(s) : ''}">${i + 1}</span><span style="display:flex;flex-direction:column;gap:2px"><b class="disp" style="font-size:15px">${s.id ? `<a href="#/place/${s.id}" style="text-decoration:none">${esc(s.name)}</a>` : esc(s.name)}</b><span style="font-size:14px;line-height:1.4">${esc(s.note)}</span></span></div>`).join('')}

  if (w.routes) w.routes.forEach(r => r.pts.forEach(q => pts.push(q)));
  makeMap('leaf', pts.length ? {pts, pad: 24} : {center: here(), zoom: 14}, m => {

function dayWalk(area) {
  const ps = [...saved].map(i => byId[i]).filter(p => p && p.area === area && p.lat != null);

  WALKS = WALKS.filter(w => w.id !== 'day'); WALKS.push({id: 'day', title: 'My day in ' + area, meta: stops.length + ' stops from My List', intro: 'Your saved places, in a sensible walking order.', color: '#F28C38', tag: 'My List', stops});

}

      <p style="margin:0"><b>Maps</b> © OpenStreetMap contributors. Missing pins are filled from postcodes using postcodes.io (contains OS data © Crown copyright and database right).</p>
      <p style="margin:0"><b>Your privacy.</b> Saved places and settings stay on your phone. If you allow location, it is used on your phone to show what is near you and is not sent to us. A Transfers enquiry only reaches us when you send the WhatsApp message yourself.${CONFIG.umami ? ' We count visits anonymously (which screens are opened, which buttons are pressed) with Umami. No cookies, and nothing that identifies you.' : ''}</p>
      ${(() => { const b = store.get('el_badphoto', []); if (!b.length) return ''; const txt = 'Wrong photos: ' + b.map(id => { const q = P.find(x => x.id === id); return q ? q.name + ' (' + id + ')' : id; }).join(', '); return `<div class="story"><b class="disp">Photos you flagged (${b.length})</b><span style="font-size:14px">${esc(txt)}</span><button class="ghost" id="copybad">Copy the list to send to Claude</button></div>`; })()}
      <button class="ghost" id="reset">Clear my saved places and settings</button>
    </div>${tabs('Explore')}`;
  const cb = document.getElementById('copybad'); if (cb) cb.onclick = async () => { const b = store.get('el_badphoto', []); const txt = 'Wrong photos: ' + b.map(id => { const q = P.find(x => x.id === id); return q ? q.name + ' (' + id + ')' : id; }).join(', '); try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch { toast('Couldn’t copy. Take a screenshot instead.'); } };
  document.getElementById('reset').onclick = () => { try { localStorage.clear(); } catch {} saved = new Set(); visited = new Set(); toast('Cleared'); };
}


/* ---------- On this day page (with birthday picker) ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function otdScreen(b) {
  const now = new Date(); let [m, d] = (b || '').split('-').map(Number);
  if (!m || !d || !ON_THIS_DAY[m + '-' + d]) { m = now.getMonth() + 1; d = now.getDate(); }
  const k = m + '-' + d, t = ON_THIS_DAY[k] || '', pid = ON_THIS_DAY_PLACE[k], pl = pid && P.find(p => p.id === pid);
  const isToday = m === now.getMonth() + 1 && d === now.getDate();
  const step = n => { const x = new Date(2024, m - 1, d + n); return (x.getMonth() + 1) + '-' + x.getDate(); };
  setTitle('On this day');
  const dayOpts = Array.from({length: 31}, (_, i) => `<option value="${i + 1}"${i + 1 === d ? ' selected' : ''}>${i + 1}</option>`).join('');
  const monOpts = MONTHS.map((n, i) => `<option value="${i + 1}"${i + 1 === m ? ' selected' : ''}>${n}</option>`).join('');
  const sel = 'height:48px;border-radius:12px;border:1px solid #C9D1DE;padding:0 10px;font-size:17px;background:#fff;color:var(--ink)';
  app.innerHTML = `<div class="top"><div class="row">${backBtn('#/')}<div style="display:flex;flex-direction:column"><h1 style="margin:0;font-weight:800;font-size:22px">On this day</h1><span style="font-size:14px;color:#C9D3E6">A London story for every day of the year</span></div></div></div>
    <div class="content">
      <div style="background:#FFF4E8;border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px">
        <div class="row" style="justify-content:space-between;align-items:center">
          <a class="iconbtn" href="#/otd/${step(-1)}" aria-label="Previous day" style="background:#fff;transform:rotate(180deg)">${svg('chev', 20, '#0F1E3D', 2.4)}</a>
          <span style="display:flex;flex-direction:column;align-items:center"><b class="disp" style="font-size:21px;color:#A8551A">${d} ${MONTHS[m - 1]}</b>${isToday ? '<span style="font-size:12px;font-weight:700;color:#A8551A;text-transform:uppercase;letter-spacing:.5px">Today</span>' : ''}</span>
          <a class="iconbtn" href="#/otd/${step(1)}" aria-label="Next day" style="background:#fff">${svg('chev', 20, '#0F1E3D', 2.4)}</a>
        </div>
        <p style="margin:0;font-size:18px;line-height:1.4;font-weight:600">${esc(t)}</p>
        ${pl ? `<a href="#/place/${pl.id}" style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px;text-decoration:none;color:var(--ink)">${catTile(pl, pl.cats[0], 40).replace('class="thumb', 'class="thumb sm')}<span style="flex:1;font-weight:700;font-size:15px">See ${esc(pl.name)}</span>${svg('chev', 16)}</a>` : ''}
        <button class="bigbtn" id="otdshare">${svg('share', 18, '#F28C38', 2.2)} Share this day</button>
      </div>
      <div style="background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(15,30,61,.08)">
        <b class="disp" style="font-size:18px">What happened on your birthday?</b>
        <span style="font-size:14px;color:var(--muted);margin-top:-6px">Pick a day and month – no year needed.</span>
        <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px"><select id="od" aria-label="Day" style="${sel}">${dayOpts}</select><select id="om" aria-label="Month" style="${sel}">${monOpts}</select></div>
        <button class="bigbtn orange" id="ogo">Show me</button>
      </div>
    </div>${tabs('Explore')}`;
  document.getElementById('ogo').onclick = () => {
    let dd = +document.getElementById('od').value; const mm = +document.getElementById('om').value;
    dd = Math.min(dd, new Date(2024, mm, 0).getDate());
    STATS.ev('On this day: date picked', {date: mm + '-' + dd}); location.hash = '#/otd/' + mm + '-' + dd;
  };
  document.getElementById('otdshare').onclick = async () => {
    const url = 'https://explorelondon.allblacktaxis.co.uk/#/otd/' + k;
    const text = `${d} ${MONTHS[m - 1]} in London – ${t}. What happened on your birthday? Find out on Explore London:`;
    STATS.ev('On this day: share', {date: k});
    try { if (navigator.share) { await navigator.share({title: 'On this day in London', text, url}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); toast('Copied – paste it anywhere'); } catch { toast('Couldn’t share from here'); }
  };
}

/* ---------- router ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  STATS.view(h);
  window.scrollTo(0, 0);
  if (h === '/' && !store.get('el_seen', 0)) return welcome();
  const [, a, b] = h.split('/');
  if (!a) return home();
  if (a === 'welcome') return welcome();
  if (a === 'cat') return category(b);
  if (a === 'place') return place(+b);
  if (a === 'map') return mapScreen(b ? +b : null);
  if (a === 'walks') return walks(b === 'all');
  if (a === 'walk') return b && b.startsWith('trip-') && !TRIPS ? loadTrips().then(() => walkScreen(b)) : b && b.startsWith('plan-') && !PLANS ? loadPlans().then(() => walkScreen(b)) : walkScreen(b);
  if (a === 'mywalk') return walkScreen('mine');
  if (a === 'daywalk') return dayWalk(b);
  if (a === 'list') return myList(b);
  if (a === 'transfers') return b && b.startsWith('trip-') && !TRIPS ? loadTrips().then(() => transfers(b)) : transfers(b);
  if (a === 'around') return around();
  if (a === 'daytrips') return dayTrips();
  if (a === 'plans') return plansScreen();
  if (a === 'plan') return planScreen(b);
  if (a === 'trip') return tripScreen(b);
  if (a === 'stay') return stayScreen();
  if (a === 'nearstay') return nearStayScreen();
  if (a === 'never') return never();
  if (a === 'about') return about();
  if (a === 'otd') return otdScreen(b);
  home();
}
addEventListener('hashchange', route);
load().then(route).catch(e => { app.innerHTML = '<div class="content"><div class="empty">Sorry, the places didn\'t load. Please refresh.</div></div>'; console.error(e); }).finally(hideLaunch);
</script>
<script src="desktop.js"></script>
</body>
</html>
